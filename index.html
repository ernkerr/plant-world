<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Plant World</title>
    <meta
      name="description"
      content="A little Mario-style Game Boy game, starring a plant in a pot. Play it here, or download it for a real Game Boy."
    />
    <meta property="og:title" content="Plant World" />
    <meta
      property="og:description"
      content="A little Mario-style Game Boy game, starring a plant in a pot."
    />
    <meta name="theme-color" content="#e9edf1" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;800&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preload" href="vendor/binjgb.wasm" as="fetch" type="application/wasm" crossorigin />
    <script src="vendor/binjgb.js" defer></script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="top">
        <div>
          <h1 class="wordmark">Plant World</h1>
          <p class="lede">A little Game Boy game. Play it here, or put it on a real one.</p>
        </div>
        <div class="tools">
          <button type="button" class="pill" id="sound" aria-pressed="true">Sound on</button>
          <button type="button" class="pill" id="stretch" aria-pressed="true">Fill the screen</button>
          <button type="button" class="pill" id="big" aria-pressed="true">Big screen</button>
          <a class="pill" href="plant-world.gb" download="plant-world.gb">Download the ROM</a>
        </div>
      </header>

      <!-- A light blue Game Boy Advance SP, opened, drawn in CSS. The buttons
           are for touch screens; keyboards and game controllers have their
           own mapping (below). -->
      <div class="stage">
        <div class="sp" id="sp">
          <!-- A pearl blue SP (AGS-101), opened and seen straight on. Drawn
               from photos of a real one; the screen is a canvas laid over the
               window in the lid. -->
          <svg viewBox="0 0 820 1560" aria-hidden="true">
            <defs>
              <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#a9ccef" />
                <stop offset="0.5" stop-color="#90b7df" />
                <stop offset="1" stop-color="#75a2d0" />
              </linearGradient>
              <!-- The rounded outer edge: lit on top, in shadow underneath. -->
              <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#d1e4f6" />
                <stop offset="0.04" stop-color="#a5c4e3" />
                <stop offset="0.95" stop-color="#769fc9" />
                <stop offset="1" stop-color="#5782ae" />
              </linearGradient>
              <!-- Pearl: a faint band of sheen across the satin finish. -->
              <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0.25" stop-color="#ffffff" stop-opacity="0" />
                <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.16" />
                <stop offset="0.62" stop-color="#ffffff" stop-opacity="0" />
              </linearGradient>
              <linearGradient id="hinge" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#5a85b0" />
                <stop offset="0.1" stop-color="#8eb3d9" />
                <stop offset="0.27" stop-color="#eaf3fc" />
                <stop offset="0.4" stop-color="#aeccea" />
                <stop offset="0.78" stop-color="#749fcb" />
                <stop offset="1" stop-color="#4b77a3" />
              </linearGradient>
              <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#1c1d1f" />
                <stop offset="1" stop-color="#0c0d0e" />
              </linearGradient>
              <!-- The light gray buttons: matte, barely domed. -->
              <radialGradient id="btn" cx="0.45" cy="0.36" r="0.7">
                <stop offset="0" stop-color="#d9dada" />
                <stop offset="0.75" stop-color="#c5c6c6" />
                <stop offset="1" stop-color="#abaeaf" />
              </radialGradient>
              <linearGradient id="cross" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#d1d2d2" />
                <stop offset="1" stop-color="#b9bbbc" />
              </linearGradient>
              <!-- A recess: its far wall in shadow, its near wall catching light. -->
              <linearGradient id="recess" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#4b76a1" />
                <stop offset="0.45" stop-color="#7ba4cd" stop-opacity="0.4" />
                <stop offset="1" stop-color="#d2e5f8" />
              </linearGradient>
              <!-- The lip around a recess: lit on top, shadowed underneath. -->
              <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#d8e7f7" />
                <stop offset="1" stop-color="#648fbb" />
              </linearGradient>
              <radialGradient id="bumper" cx="0.4" cy="0.35" r="0.7">
                <stop offset="0" stop-color="#caddf1" />
                <stop offset="0.7" stop-color="#a6c4e2" />
                <stop offset="1" stop-color="#83a8cd" />
              </radialGradient>
              <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
                <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#183f67" flood-opacity="0.4" />
              </filter>
              <filter id="hinge-shadow" x="-5%" y="-30%" width="110%" height="180%">
                <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#183f67" flood-opacity="0.3" />
              </filter>
            </defs>

            <!-- Bottom half -->
            <path d="M 16 790 H 804 A 16 16 0 0 1 820 806 V 1480 A 80 80 0 0 1 740 1560 H 80 A 80 80 0 0 1 0 1480 V 806 A 16 16 0 0 1 16 790 Z" fill="url(#edge)" />
            <path id="base-face" d="M 20 796 H 800 A 14 14 0 0 1 814 810 V 1478 A 75 75 0 0 1 739 1553 H 81 A 75 75 0 0 1 6 1478 V 810 A 14 14 0 0 1 20 796 Z" fill="url(#shell)" />
            <use href="#base-face" fill="url(#sheen)" />

            <!-- Power light, on the right edge -->
            <g class="led" id="led">
              <rect class="glow" x="796" y="827" width="18" height="11" rx="5.5" fill="#9dffad" />
              <rect class="dot" x="800" y="830" width="10" height="5" rx="2" />
            </g>
            <rect x="800" y="846" width="10" height="5" rx="2" fill="#335a81" />

            <!-- Lid -->
            <path d="M 56 0 H 764 A 56 56 0 0 1 820 56 V 676 A 24 24 0 0 1 796 700 H 24 A 24 24 0 0 1 0 676 V 56 A 56 56 0 0 1 56 0 Z" fill="url(#edge)" />
            <path id="lid-face" d="M 58 6 H 762 A 52 52 0 0 1 814 58 V 674 A 20 20 0 0 1 794 694 H 26 A 20 20 0 0 1 6 674 V 58 A 52 52 0 0 1 58 6 Z" fill="url(#shell)" />
            <use href="#lid-face" fill="url(#sheen)" />

            <!-- The black lens over the screen, with the name where the logo goes -->
            <rect x="77" y="82" width="666" height="561" rx="16" fill="none" stroke="#4b76a1" stroke-opacity="0.55" stroke-width="2" />
            <rect x="80" y="85" width="660" height="555" rx="14" fill="url(#lens)" />
            <rect x="81" y="86" width="658" height="553" rx="13" fill="none" stroke="#33363a" stroke-width="2" />
            <rect x="100" y="105" width="620" height="417" fill="#070708" />
            <rect x="105" y="110" width="610" height="407" fill="#000000" />
            <text class="logo" x="410" y="597" text-anchor="middle">PLANT WORLD</text>

            <!-- Rubber bumpers -->
            <g>
              <circle cx="40" cy="40" r="24" fill="#5b86b1" opacity="0.45" /><circle cx="40" cy="40" r="21" fill="url(#bumper)" />
              <circle cx="410" cy="40" r="24" fill="#5b86b1" opacity="0.45" /><circle cx="410" cy="40" r="21" fill="url(#bumper)" />
              <circle cx="780" cy="40" r="24" fill="#5b86b1" opacity="0.45" /><circle cx="780" cy="40" r="21" fill="url(#bumper)" />
              <circle cx="40" cy="667" r="24" fill="#5b86b1" opacity="0.45" /><circle cx="40" cy="667" r="21" fill="url(#bumper)" />
              <circle cx="780" cy="667" r="24" fill="#5b86b1" opacity="0.45" /><circle cx="780" cy="667" r="21" fill="url(#bumper)" />
            </g>

            <!-- The hinge: one cylinder across the whole width, in four parts.
                 L and R are on the back; tapping either end works too. -->
            <rect x="0" y="698" width="820" height="94" rx="47" fill="url(#hinge)" filter="url(#hinge-shadow)" />
            <g stroke-width="3">
              <line x1="92" y1="702" x2="92" y2="788" stroke="#477099" stroke-opacity="0.6" />
              <line x1="95" y1="702" x2="95" y2="788" stroke="#ffffff" stroke-opacity="0.3" />
              <line x1="406" y1="702" x2="406" y2="788" stroke="#477099" stroke-opacity="0.6" />
              <line x1="409" y1="702" x2="409" y2="788" stroke="#ffffff" stroke-opacity="0.3" />
              <line x1="728" y1="702" x2="728" y2="788" stroke="#477099" stroke-opacity="0.6" />
              <line x1="731" y1="702" x2="731" y2="788" stroke="#ffffff" stroke-opacity="0.3" />
            </g>
            <rect class="hit key" data-shoulder x="0" y="698" width="92" height="94" />
            <rect class="hit key" data-shoulder x="728" y="698" width="92" height="94" />

            <!-- Light button -->
            <circle cx="426" cy="892" r="29" fill="none" stroke="url(#lip)" stroke-width="2.5" />
            <circle cx="426" cy="892" r="27" fill="#8bb0d5" />
            <circle cx="426" cy="892" r="25" fill="none" stroke="url(#recess)" stroke-width="4" />
            <g class="key" data-light>
              <circle class="hit" cx="426" cy="892" r="44" />
              <circle cx="426" cy="892" r="20" fill="#456a90" opacity="0.5" />
              <g class="cap" filter="url(#drop)">
                <circle cx="426" cy="892" r="17" fill="url(#btn)" />
                <g fill="none" stroke="#a6a9aa" stroke-width="1.8" stroke-linecap="round">
                  <circle cx="426" cy="892" r="4" />
                  <path d="M 426 882 v 2.5 M 426 899.5 v 2.5 M 416 892 h 2.5 M 433.5 892 h 2.5 M 419 885 l 1.8 1.8 M 431.2 897.2 l 1.8 1.8 M 419 899 l 1.8 -1.8 M 431.2 886.8 l 1.8 -1.8" />
                </g>
                <circle class="shade" cx="426" cy="892" r="17" />
              </g>
            </g>

            <!-- D-pad, in its round dip -->
            <circle cx="197" cy="1000" r="128" fill="none" stroke="url(#lip)" stroke-width="3" />
            <circle cx="197" cy="1000" r="126" fill="#8cb1d6" />
            <circle cx="197" cy="1000" r="123" fill="none" stroke="url(#recess)" stroke-width="5" />
            <g data-pad transform="translate(197 1000)">
              <circle class="hit" r="128" />
              <path d="M -27 -94 H 27 Q 37 -94 37 -84 V -37 H 84 Q 94 -37 94 -27 V 27 Q 94 37 84 37 H 37 V 84 Q 37 94 27 94 H -27 Q -37 94 -37 84 V 37 H -84 Q -94 37 -94 27 V -27 Q -94 -37 -84 -37 H -37 V -84 Q -37 -94 -27 -94 Z" fill="#456a90" opacity="0.5" />
              <g filter="url(#drop)">
                <path d="M -24 -88 H 24 Q 31 -88 31 -81 V -31 H 81 Q 88 -31 88 -24 V 24 Q 88 31 81 31 H 31 V 81 Q 31 88 24 88 H -24 Q -31 88 -31 81 V 31 H -81 Q -88 31 -88 24 V -24 Q -88 -31 -81 -31 H -31 V -81 Q -31 -88 -24 -88 Z" fill="url(#cross)" />
                <path d="M -24 -88 H 24 Q 31 -88 31 -81 V -31 H 81 Q 88 -31 88 -24 V 24 Q 88 31 81 31 H 31 V 81 Q 31 88 24 88 H -24 Q -31 88 -31 81 V 31 H -81 Q -88 31 -88 24 V -24 Q -88 -31 -81 -31 H -31 V -81 Q -31 -88 -24 -88 Z" fill="none" stroke="#e8e9e9" stroke-opacity="0.7" stroke-width="1.5" />
                <circle r="16" fill="#b4b6b7" opacity="0.45" />
                <rect class="arm" data-dir="up" x="-31" y="-88" width="62" height="57" rx="7" />
                <rect class="arm" data-dir="down" x="-31" y="31" width="62" height="57" rx="7" />
                <rect class="arm" data-dir="left" x="-88" y="-31" width="57" height="62" rx="7" />
                <rect class="arm" data-dir="right" x="31" y="-31" width="57" height="62" rx="7" />
              </g>
            </g>

            <!-- B and A, in their oval well -->
            <g transform="rotate(-3 566 1072)">
              <rect x="431" y="1011" width="270" height="122" rx="61" fill="none" stroke="url(#lip)" stroke-width="3" />
              <rect x="433" y="1013" width="266" height="118" rx="59" fill="#8cb1d6" />
              <rect x="436" y="1016" width="260" height="112" rx="56" fill="none" stroke="url(#recess)" stroke-width="5" />
              <g class="key" data-button="B">
                <circle class="hit" cx="500" cy="1072" r="62" />
                <circle cx="500" cy="1072" r="43" fill="#456a90" opacity="0.5" />
                <g class="cap" filter="url(#drop)">
                  <circle cx="500" cy="1072" r="39" fill="url(#btn)" />
                  <text class="emboss-light" x="500" y="1083.2" text-anchor="middle">B</text>
                  <text class="emboss" x="500" y="1082" text-anchor="middle">B</text>
                  <circle class="shade" cx="500" cy="1072" r="39" />
                </g>
              </g>
              <g class="key" data-button="A">
                <circle class="hit" cx="632" cy="1072" r="62" />
                <circle cx="632" cy="1072" r="43" fill="#456a90" opacity="0.5" />
                <g class="cap" filter="url(#drop)">
                  <circle cx="632" cy="1072" r="39" fill="url(#btn)" />
                  <text class="emboss-light" x="632" y="1083.2" text-anchor="middle">A</text>
                  <text class="emboss" x="632" y="1082" text-anchor="middle">A</text>
                  <circle class="shade" cx="632" cy="1072" r="39" />
                </g>
              </g>
            </g>

            <!-- Speaker -->
            <g>
              <circle cx="332" cy="1113.6" r="5.5" fill="#cadff5" opacity="0.55" /><circle cx="332" cy="1112" r="5.5" fill="#3e658c" />
              <circle cx="306" cy="1139.6" r="5.5" fill="#cadff5" opacity="0.55" /><circle cx="306" cy="1138" r="5.5" fill="#3e658c" />
              <circle cx="280" cy="1165.6" r="5.5" fill="#cadff5" opacity="0.55" /><circle cx="280" cy="1164" r="5.5" fill="#3e658c" />
              <circle cx="254" cy="1191.6" r="5.5" fill="#cadff5" opacity="0.55" /><circle cx="254" cy="1190" r="5.5" fill="#3e658c" />
              <circle cx="358" cy="1139.6" r="5.5" fill="#cadff5" opacity="0.55" /><circle cx="358" cy="1138" r="5.5" fill="#3e658c" />
              <circle cx="332" cy="1165.6" r="5.5" fill="#cadff5" opacity="0.55" /><circle cx="332" cy="1164" r="5.5" fill="#3e658c" />
              <circle cx="306" cy="1191.6" r="5.5" fill="#cadff5" opacity="0.55" /><circle cx="306" cy="1190" r="5.5" fill="#3e658c" />
              <circle cx="280" cy="1217.6" r="5.5" fill="#cadff5" opacity="0.55" /><circle cx="280" cy="1216" r="5.5" fill="#3e658c" />
              <circle cx="384" cy="1165.6" r="5.5" fill="#cadff5" opacity="0.55" /><circle cx="384" cy="1164" r="5.5" fill="#3e658c" />
              <circle cx="358" cy="1191.6" r="5.5" fill="#cadff5" opacity="0.55" /><circle cx="358" cy="1190" r="5.5" fill="#3e658c" />
              <circle cx="332" cy="1217.6" r="5.5" fill="#cadff5" opacity="0.55" /><circle cx="332" cy="1216" r="5.5" fill="#3e658c" />
              <circle cx="306" cy="1243.6" r="5.5" fill="#cadff5" opacity="0.55" /><circle cx="306" cy="1242" r="5.5" fill="#3e658c" />
              <circle cx="410" cy="1191.6" r="5.5" fill="#cadff5" opacity="0.55" /><circle cx="410" cy="1190" r="5.5" fill="#3e658c" />
              <circle cx="384" cy="1217.6" r="5.5" fill="#cadff5" opacity="0.55" /><circle cx="384" cy="1216" r="5.5" fill="#3e658c" />
              <circle cx="358" cy="1243.6" r="5.5" fill="#cadff5" opacity="0.55" /><circle cx="358" cy="1242" r="5.5" fill="#3e658c" />
              <circle cx="332" cy="1269.6" r="5.5" fill="#cadff5" opacity="0.55" /><circle cx="332" cy="1268" r="5.5" fill="#3e658c" />
            </g>

            <!-- SELECT and START, each in a round dip, with raised labels -->
            <text class="label-light" x="205" y="1285.5" text-anchor="middle">SELECT</text>
            <text class="label" x="205" y="1284" text-anchor="middle">SELECT</text>
            <text class="label-light" x="340" y="1299.5" text-anchor="middle">START</text>
            <text class="label" x="340" y="1298" text-anchor="middle">START</text>
            <circle cx="205" cy="1352" r="50" fill="none" stroke="url(#lip)" stroke-width="3" />
            <circle cx="205" cy="1352" r="48" fill="#8cb1d6" />
            <circle cx="205" cy="1352" r="45" fill="none" stroke="url(#recess)" stroke-width="4" />
            <circle cx="340" cy="1366" r="50" fill="none" stroke="url(#lip)" stroke-width="3" />
            <circle cx="340" cy="1366" r="48" fill="#8cb1d6" />
            <circle cx="340" cy="1366" r="45" fill="none" stroke="url(#recess)" stroke-width="4" />
            <g class="key" data-button="select">
              <circle class="hit" cx="205" cy="1352" r="56" />
              <circle cx="205" cy="1352" r="30" fill="#456a90" opacity="0.5" />
              <g class="cap" filter="url(#drop)">
                <circle cx="205" cy="1352" r="26" fill="url(#btn)" />
                <circle class="shade" cx="205" cy="1352" r="26" />
              </g>
            </g>
            <g class="key" data-button="start">
              <circle class="hit" cx="340" cy="1366" r="56" />
              <circle cx="340" cy="1366" r="30" fill="#456a90" opacity="0.5" />
              <g class="cap" filter="url(#drop)">
                <circle cx="340" cy="1366" r="26" fill="url(#btn)" />
                <circle class="shade" cx="340" cy="1366" r="26" />
              </g>
            </g>
          </svg>

          <div class="lcd" id="lcd">
            <canvas id="screen" width="160" height="144" role="img" aria-label="The Game Boy screen"></canvas>
            <p class="lcd-note" id="note" hidden></p>
          </div>
          <!-- Light catching the glass, over the picture. -->
          <span class="glare" aria-hidden="true"></span>
        </div>
      </div>

      <footer class="bottom">
        <p class="keys" id="keys">
          <span><kbd>←</kbd> <kbd>→</kbd> run</span>
          <span><kbd>↑</kbd> <kbd>↓</kbd> climb</span>
          <span><kbd>X</kbd> jump (A)</span>
          <span><kbd>Z</kbd> B</span>
          <span><kbd>Enter</kbd> start</span>
          <span><kbd>L</kbd> or <kbd>R</kbd> fill the screen</span>
        </p>
        <p class="credit">
          By <a href="https://erinkerr.me">Erin Kerr</a>. Runs on
          <a href="https://github.com/binji/binjgb">binjgb</a>, an open-source Game Boy emulator by Ben Smith.
        </p>
      </footer>
    </main>
  </body>
</html>
